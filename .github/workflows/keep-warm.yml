name: Keep backend warm

# Pings the Render service's /health endpoint on a schedule so the free-tier
# container never sleeps (~15 min idle = sleep). This avoids the slow/failed
# "cold start" first PDF. Runs even with no code changes.
on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 40 \
              https://safe-calculator-backend.onrender.com/health || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Health check did not return 200 (server may have been waking)."
